name: Light Years Learning checks

on:
  push:
    branches: [light-years-learning-android]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-quiz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test dependency
        run: npm install --prefix tools/testdom --no-save --no-package-lock jsdom@26.1.0
      - name: Check inline JavaScript syntax
        run: node -e 'const h=require("fs").readFileSync("app/src/main/assets/index.html","utf8"); const s=h.indexOf("<script>"),e=h.indexOf("</script>",s); if(s<0||e<0) throw Error("Missing quiz script"); new Function(h.slice(s+8,e));'
      - name: Run quiz and progress-restoration tests
        run: node test-logic.cjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run mobile browser and layout checks
        run: node test.cjs
