name: Light Years Learning checks

on:
  push:
    branches: [light-years-learning-android]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-quiz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test dependency
        run: npm install --prefix tools/testdom --no-save --no-package-lock jsdom@26.1.0
      - name: Check inline JavaScript syntax
        run: node -e 'const fs=require("fs"), h=fs.readFileSync("app/src/main/assets/index.html","utf8"), m=h.match(/<script>([\\s\\S]*?)<\\/script>/); if (!m) throw Error("Missing quiz script"); new Function(m[1]);'
      - name: Run quiz and progress-restoration tests
        run: node test-logic.cjs
      - name: Run extra quiz checks
        run: node test.cjs
