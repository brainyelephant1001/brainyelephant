name: ESOL Course Validation
on:
  push:
    branches: [esol-integration-testing]
    paths: ['esol/**','tests/**','package.json','.github/workflows/esol-validation.yml']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm run test:esol
