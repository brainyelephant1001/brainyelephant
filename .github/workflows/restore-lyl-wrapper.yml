name: Restore LYL Gradle wrapper
on:
  push:
    branches: [light-years-learning-android]
    paths:
      - '.github/workflows/restore-lyl-wrapper.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Generate standalone Gradle wrapper
        run: |
          mkdir -p "$RUNNER_TEMP/wrappergen"
          printf "rootProject.name = 'wrappergen'\n" > "$RUNNER_TEMP/wrappergen/settings.gradle"
          cd "$RUNNER_TEMP/wrappergen"
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          cp -r gradle/wrapper "$GITHUB_WORKSPACE/gradle/"
          cp gradlew gradlew.bat "$GITHUB_WORKSPACE/"
          chmod +x "$GITHUB_WORKSPACE/gradlew"
      - name: Commit wrapper to LYL branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties gradlew gradlew.bat
          git diff --cached --quiet || { git commit -m "Restore Gradle 8.11.1 wrapper for Android Studio"; git push; }
