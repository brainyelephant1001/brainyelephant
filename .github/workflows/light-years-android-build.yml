name: Light Years Learning Android build

on:
  push:
    branches: [light-years-learning-android]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 16 SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify LYL launcher artwork can be decoded
        run: |
          python3 -m pip install --quiet pillow
          python3 -c 'from PIL import Image; im=Image.open("app/src/main/res/drawable-nodpi/lyl_logo.jpg"); im.load(); print("LYL launcher image verified:", im.size)'
      - name: Compile debug APK and unsigned release bundle
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease
      - name: Preserve non-publishing test build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: light-years-android-unsigned-build
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
