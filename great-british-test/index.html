{display:flex;justify-content:space-between;gap:15px;align-items:center}.score{background:#e6ebdf;padding:11px 18px;border-radius:8px;font-size:13px}.score strong{font-size:23px;margin-left:10px}.progress{display:flex;gap:7px;margin:22px 0 34px}.progress span{height:5px;border-radius:4px;flex:1;background:#dce1d4}.progress .done{background:var(--green)}.progress .current{background:var(--orange)}.card{background:#fffdf7;border:1px solid #e0e1d4;border-radius:16px;padding:clamp(24px,5vw,46px);box-shadow:0 8px 30px #193f3506}.saying{font-size:clamp(25px,4.8vw,38px);line-height:1.65;margin:20px 0 30px}.blank{color:var(--orange);white-space:nowrap;letter-spacing:3px}label{display:block;font-size:13px;font-weight:600;margin-bottom:9px}input{width:100%;background:white;border:1px solid #aab7a4;border-radius:8px;padding:16px;font-size:18px;color:var(--green);min-height:56px}input:focus{outline:2px solid var(--green);outline-offset:2px}.formrow{display:flex;gap:12px}.formrow input{min-width:0}.formrow button{white-space:nowrap}.feedback{background:#eaf0e2;border-radius:10px;padding:22px;margin:25px 0 0}.feedback.wrong{background:#f7e9e0}.feedback h2{font-family:inherit;font-size:19px;font-weight:700;margin:0 0 12px}.feedback p{margin:10px 0;line-height:1.6}.answer{font-family:Georgia,serif;font-size:27px}.secondary{background:transparent;color:var(--green);border:1px solid #abb8a4}.centre{text-align:center}.bigscore{font-family:Georgia,serif;font-size:96px;margin:20px 0;color:var(--orange)}.rounds{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:25px 0}.rounds div{background:#e9edde;border-radius:8px;padding:15px}.rounds strong{display:block;font-size:22px;margin-top:8px}details{text-align:left;margin:20px 0;border-top:1px solid #d8dccc;padding:20px 0}summary{cursor:pointer;font-weight:600}.review{padding:15px 0;border-bottom:1px solid #d8dccc;line-height:1.6}.review small{display:block;color:var(--muted)}footer{text-align:center;color:#7c8579;font-size:12 </style><link rel="icon" type="image/png" href="elephant.png"></head><body><header><a href="./" aria-label="The Great British Test home"><img class="brand-logo" src="elephant.png" alt="Brainy Elephant Union Jack emblem"><span><small class="parent-brand">BRAINY ELEPHANT</small>THE GREAT BRITISH TEST</span></a><span class="edition">HOW BRITISH ARE YOU?</span></header><main id="app"></main><footer>A little wisdom. A proper test of memory.</footer><script>window.sayings = `

</script><script>const app=document.getElementById('app');
const KEY='cooling-fan-v2-100';const SCORES_KEY='brainyelephant-gbt-score-history-v1';let game=null;try{game=JSON.parse(localStorage.getItem(KEY))}catch{}
function save(){try{localStorage.setItem(KEY,JSON.stringify(game))}catch{}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function isCorrect(input,q){const response=normal(input);return response===normal(q.answer)||(q.answer==='hatch'&&response==='hatched')}
function normal(s){return String(s).normalize("NFKC").trim().toLowerCase().replace(/[’‘`´ʼ’‘′´`']/g,"").replace(/\s+/g," ")}
function scoreHistory(){try{const h=JSON.parse(localStorage.getItem(SCORES_KEY)||'[]');return Array.isArray(h)?h:[]}catch{return []}}
function recordFinishedGame(){if(!game||game.phase!=='finished'||game.recorded)return;const h=scoreHistory();const c=game.answers.filter(a=>a.correct).length;h.push({date:new Date().toISOString(),score:score(),correct:c,total:25});try{localStorage.setItem(SCORES_KEY,JSON.stringify(h));game.recorded=true;save()}catch(e){}}
function stats(){const h=scoreHistory();const count=h.length, avg=count?(h.reduce((n,a)=>n+a.score,0)/count).toFixed(1):'—';const high=count?Math.max(...h.map(a=>a.score)):'—';const scores=h.map(a=>a.score),bands=[[-25,-1],[0,9],[10,19],[20,25]];app.innerHTML=`<section class="card centre"><h1>Your quiz statistics</h1><p class="small">Saved on this device only. These are not combined with other players’ scores.</p><div class="rounds"><div><span class="small">Completed quizzes</span><strong>${count}</strong></div><div><span class="small">Average score</span><strong>${avg}</strong></div><div><span class="small">Best score</span><strong>${high}</strong></div></div><h2>Score distribution</h2>${bands.map(([lo,hi])=>`<p>${lo} to ${hi}: <strong>${scores.filter(x=>x>=lo&&x<=hi).length}</strong></p>`).join('')}<button type="button" class="primary" id="statsback">BACK TO QUIZ</button></section>`;document.getElementById('statsback').onclick=()=>home()}
function signed(n){return n>0?'+'+n:String(n)}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){game={ids:[0,1,...shuffle(sayings.slice(2).map(q=>q.id)).slice(0,23)],index:0,answers:[],phase:'question'};save();render()}
function score(){return game.answers.reduce((n,a)=>n+(a.correct?1:-1),0)}
function home(){app.innerHTML=`<section class="hero"><img class="hero-emblem" src="elephant.png" alt="Brainy Elephant red, white and blue emblem"><span class="badge eyebrow">OLD SAYINGS. FRESH CHALLENGE.</span><h1>The Great<br>British Test.<br><em>How British are you?</em></h1><p class="intro">The sayings we grew up with. The wisdom we passed down. But can you remember that one missing word?</p><button class="primary" id="start">${game&&game.phase!=='finished'?'CONTINUE QUIZ':'START QUIZ'}<span class="arrow">→</span></button><p class="small">No choices. No hints. Just you and your memory.</p></section><section class="rules"><div><strong>5 × 5</strong><span>Five rounds. Five sayings each.</span></div><div><strong>+1 / −1</strong><span>Right earns one. Wrong loses one.</span></div><div><strong>One chance</strong><span>And yes, scores can go below zero.</span></div></section><blockquote class="quote">“A little of what you fancy does you good.”</blockquote><p class="small">100 sayings in the collection · 25 questions per game · No time limit</p><button type="button" class="secondary" id="stats">VIEW MY QUIZ STATISTICS</button>`;document.getElementById('stats').onclick=stats;document.getElementById('start').onclick=()=>game&&game.phase!=='finished'?render():start()}
function revealNext(){try{document.activeElement.blur()}catch(e){} requestAnimationFrame(()=>{const b=document.getElementById('next');if(b)b.scrollIntoView({behavior:'auto',block:'center'});});}
function render(){if(!game)return home();if(game.phase==='finished')return finish();if(game.phase==='round')return round();const q=sayings[game.ids[game.index]],a=game.answers[game.index],r=Math.floor(game.index/5)+1;app.innerHTML=`<div class="topline"><span class="eyebrow">ROUND ${r} OF 5 · SAYING ${game.index%5+1} OF 5</span><span class="score">Score <strong>${signed(score())}</strong></span></div><div class="progress" aria-label="Question ${game.index+1} of 25">${Array.from({length:25},(_,i)=>`<span class="${i<game.index?'done':i===game.index?'current':''}"></span>`).join('')}</div><section class="card"><span class="eyebrow">${a?'THE WORD REVEALED':'ONE WORD MISSING. ONE CHANCE.'}</span><p class="saying">${esc(q.text).replace(/\{(.+?)\}/,a?'<span class="answer">$1</span>':'<span class="blank">_____</span>')}</p>${a?`<div class="feedback ${a.correct?'':'wrong'}" role="status"><h2>${a.correct?'Spot on! +1 point':'Not this time. −1 point'}</h2><p>Your answer: <strong>${esc(a.input)}</strong><br>Correct word: <strong>${esc(q.answer)}</strong></p><p>${esc(q.meaning)}</p></div><button class="primary" id="next" type="button">NEXT QUESTION <span class="arrow">→</span></button>`:`<form id="guess"><label for="answer">Your missing word</label><div class="formrow"><input id="answer" name="answer" placeholder="Type your answer…" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" required maxlength="60"><button type="submit" id="submit" disabled>Lock it in →</button></div><p class="small">Check your spelling. Once submitted, your answer is final.</p><button type="button" class="secondary" id="dontknow">Don’t know · −1 point</button></form>`}</section><p class="small centre">Question ${game.index+1} of 25 · No rush. Have a think.</p>`;if(a)document.getElementById('next').onclick=()=>{if(game.index%5===4)game.phase='round';else game.index++;save();render();window.scrollTo(0,0)};else{const input=document.getElementById('answer'),submit=document.getElementById('submit');input.oninput=()=>submit.disabled=!input.value.trim();document.getElementById('dontknow').onclick=()=>{if(game.answers[game.index])return;game.answers.push({input:'Don’t know',correct:false});save();render();revealNext()} ;document.getElementById('guess').onsubmit=e=>{e.preventDefault();if(game.answers[game.index]||!input.value.trim())return;game.answers.push({input:input.value.trim(),correct:isCorrect(input.value,q)});save();render();revealNext()}}}
const badges=[
 {icon:'☕',name:'Kettle On',message:'Your first step closer to being British. Put the kettle on!'},
 {icon:'🍪',name:'Biscuit Dunker',message:'Two steps closer to being British. Time for a biscuit with that tea.'},
 {icon:'☂',name:'Weather Watcher',message:'Three steps closer to being British. Looks like rain, doesn’t it?'},
 {icon:'🎩',name:'Proper Good Sport',message:'Four steps closer to being British. You’re nearly there — keep your chin up!'},
 {icon:'🏅',name:'Great British Finisher',message:'Five steps complete! A proper British sayings adventure — and you’ve earned your final badge.'}
];
function badgeCard(i){const b=badges[i];return `<div class="earned-badge"><span class="badge-icon" aria-hidden="true">${b.icon}</span><span class="eyebrow">BADGE ${i+1} OF 5 EARNED</span><h2>${b.name}</h2><p>${b.message}</p></div>`}
function round(){const r=Math.floor(game.index/5)+1,rs=game.answers.slice(-5).reduce((n,a)=>n+(a.correct?1:-1),0);app.innerHTML=`<section class="card centre"><span class="eyebrow">ROUND ${r} COMPLETE</span>${badgeCard(r-1)}<div class="badge-trail" aria-label="${r} of 5 badges earned">${badges.map((b,i)=>`<span class="${i<r?'unlocked':'locked'}" aria-label="${b.name}: ${i<r?'earned':'not yet earned'}">${i<r?b.icon:'○'}</span>`).join('')}</div><p>Round score: <strong>${signed(rs)}</strong> · Total so far: <strong>${signed(score())}</strong></p><p>${game.answers.slice(-5).filter(a=>a.correct).length} out of 5 sayings remembered.</p><p class="small">Badges celebrate completing each round. Your answers decide your score.</p><button class="primary" id="continue">${r===5?'See final score':'Start round '+(r+1)} →</button></section>`;document.getElementById('continue').onclick=()=>{if(r===5)game.phase='finished';else{game.index++;game.phase='question'}save();render();window.scrollTo(0,0)}}
function finish(){recordFinishedGame();const s=score(),correct=game.answers.filter(a=>a.correct).length;app.innerHTML=`<section class="centre"><span class="badge eyebrow">FIVE ROUNDS. ALL DONE.</span><h1>${s>=15?'You know your sayings!':s>=0?'A few pearls of wisdom.':'A little wiser already.'}</h1><p class="small">YOUR FINAL SCORE</p><div class="bigscore">${signed(s)}</div><p>${correct} correct · ${25-correct} incorrect · Possible score: −25 to +25</p><div class="rounds">${Array.from({length:5},(_,i)=>`<div><span class="small">Round ${i+1}</span><strong>${signed(game.answers.slice(i*5,i*5+5).reduce((n,a)=>n+(a.correct?1:-1),0))}</strong></div>`).join('')}</div><div class="badge-collection"><h2>Your five earned badges</h2><div class="badge-trail">${badges.map(b=>`<div><span class="unlocked">${b.icon}</span><small>${b.name}</small></div>`).join('')}</div></div><button class="primary" id="again">Play another game →</button><button class="secondary" id="viewstats" type="button">VIEW MY QUIZ STATISTICS</button><p class="small">A fresh selection from 100 sayings, with your two opening favourites.</p><details><summary>Look back at all 25 answers</summary>${game.ids.map((id,i)=>`<div class="review">${game.answers[i].correct?'✓':'✕'} ${esc(sayings[id].text).replace(/\{(.+?)\}/,'<strong>$1</strong>')}<small>Your answer: ${esc(game.answers[i].input)} · ${esc(sayings[id].meaning)}</small></div>`).join('')}</details></section>`;document.getElementById('again').onclick=start;document.getElementById('viewstats').onclick=stats}
if(game&&(!Array.isArray(game.ids)||game.ids.length!==25||!Array.isArray(game.answers)))game=null;home();
</script></body></html>
