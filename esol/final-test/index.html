<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brainy Elephant | ESOL Final Practice Test</title>
<style>
:root{color-scheme:light;font:16px/1.55 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#f3f6fa;color:#1b2d42}*{box-sizing:border-box}body{margin:0}header{background:#102e50;color:#fff;border-bottom:5px solid #be344a}header .wrap{max-width:1000px;margin:auto;padding:22px 20px}header b{font-size:1.18rem;letter-spacing:.01em}header small{display:block;color:#dbe6f2}main{max-width:1000px;margin:25px auto;padding:0 18px 48px}.card{background:white;border:1px solid #dbe4ed;border-radius:13px;padding:25px;box-shadow:0 4px 14px #16325210}.muted{color:#546a7e}.note{background:#eef4fa;border-left:4px solid #2d5e91;padding:12px 15px;border-radius:4px;margin:15px 0}.warning{background:#fff8e9;border-left-color:#996b21}button{cursor:pointer;font:inherit;border:1px solid #164b80;border-radius:9px;padding:11px 17px;background:#164b80;color:white;font-weight:650}button:hover{filter:brightness(.93)}button:focus-visible,input:focus-visible{outline:3px solid #d03b52;outline-offset:3px}button.secondary{background:#fff;color:#164b80}button:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}.choices{border:0;padding:0;margin:18px 0}.choices legend{font-weight:700;margin-bottom:12px}.choice{display:block;border:1px solid #c9d7e4;border-radius:9px;padding:12px 13px;margin-bottom:9px;cursor:pointer}.choice:has(input:checked){background:#eaf2fc;border-color:#2461a4}.choice input{margin-right:10px}.progress{height:10px;background:#e1e9f1;border-radius:6px;overflow:hidden;margin:18px 0}.progress span{height:100%;background:#215d99;display:block}table{border-collapse:collapse;width:100%;margin:15px 0}th,td{text-align:left;border-bottom:1px solid #dce5ee;padding:10px}th{background:#f1f5f9}.good{color:#176546;font-weight:700}.bad{color:#a02b39;font-weight:700}.review{border:1px solid #d8e2ea;border-radius:9px;padding:15px;margin:11px 0}.review h3{margin:0 0 8px;font-size:1.02rem}.review p{margin:5px 0}.tag{font-size:.85rem;font-weight:700;color:#516c88}h1{line-height:1.25;font-size:1.7rem}h2{line-height:1.3}#status{min-height:1.5em}footer{padding:0 20px 25px;text-align:center;color:#64758a;font-size:.82rem}@media(max-width:520px){.card{padding:17px}h1{font-size:1.38rem}}
</style></head><body>
<header><div class="wrap"><b>Brainy Elephant</b><small>ESOL Learning • Final Practice Test</small></div></header>
<main><section class="card" id="screen" aria-live="polite"></section></main>
<footer>Brainy Elephant educational practice • Not an Ofqual-regulated qualification</footer>
<script type="module">
import {getEsolUser,getEsolProgress} from "../lesson-sync.js";
'use strict';
const BANK=[{"id":"Q01","level":2,"topic":"Appointment changes","question":"Your appointment moved from 9 am to 11:30 am on Tuesday. What time should you attend?","options":["9 am","11:30 am","Tuesday evening","Monday"],"correct":1,"explanation":"Correct answer: 11:30 am."},{"id":"Q02","level":2,"topic":"Past tense","question":"Complete: Yesterday I ___ my friend.","options":["visit","visiting","visited","visits"],"correct":2,"explanation":"Correct answer: visited."},{"id":"Q03","level":2,"topic":"Public transport","question":"A notice states: No trains after 9 pm. When is the last permitted departure?","options":["10 pm","Before or at 9 pm","Midnight","Tomorrow only"],"correct":1,"explanation":"Correct answer: Before or at 9 pm."},{"id":"Q04","level":2,"topic":"Clarification","question":"What is a polite way to ask someone to speak more slowly?","options":["Speak slowly, please.","You are wrong.","Go away.","I know everything."],"correct":0,"explanation":"Correct answer: Speak slowly, please.."},{"id":"Q05","level":2,"topic":"Working hours","question":"Your shift begins at 08:30. You must arrive 10 minutes early. When should you arrive?","options":["08:40","08:30","08:20","09:00"],"correct":2,"explanation":"Correct answer: 08:20."},{"id":"Q06","level":2,"topic":"Reasons","question":"Select a sentence that explains why.","options":["I took the bus because it was raining.","The bus is red.","It is Tuesday.","The shop is nearby."],"correct":0,"explanation":"Correct answer: I took the bus because it was raining.."},{"id":"Q07","level":2,"topic":"Directions","question":"Walk past the bank, then turn right. What do you do after the bank?","options":["Stop forever","Turn left","Turn right","Cross the river"],"correct":2,"explanation":"Correct answer: Turn right."},{"id":"Q08","level":2,"topic":"Deadlines","question":"A form must arrive by Thursday. When is an appropriate time to send it?","options":["Friday evening","Next month","Before Thursday ends","Saturday"],"correct":2,"explanation":"Correct answer: Before Thursday ends."},{"id":"Q09","level":2,"topic":"Future plans","question":"Which sentence describes a future intention?","options":["I went home.","I am going to study tonight.","I studied last year.","I study every day."],"correct":1,"explanation":"Correct answer: I am going to study tonight.."},{"id":"Q10","level":2,"topic":"Prices","question":"A ticket is £6 and another is £9. What is the difference?","options":["£3","£6","£9","£15"],"correct":0,"explanation":"Correct answer: £3."},{"id":"Q11","level":2,"topic":"Reading signs","question":"A sign says 'Staff only'. Who may go through the door?","options":["All customers","Employees","Everyone over 18","Visitors"],"correct":1,"explanation":"Correct answer: Employees."},{"id":"Q12","level":2,"topic":"Forms","question":"Where should you write a postcode?","options":["In the box marked Postcode","In the box marked Surname","In the box marked Age","In the signature box"],"correct":0,"explanation":"Correct answer: In the box marked Postcode."},{"id":"Q13","level":3,"topic":"Opinions","question":"Which sentence gives a preference and a reason?","options":["I prefer trains because I can read.","My train is late.","The train is blue.","I own a ticket."],"correct":0,"explanation":"Correct answer: I prefer trains because I can read.."},{"id":"Q14","level":3,"topic":"Safety","question":"A sign says 'Use stairs in case of fire'. What should you do during a fire?","options":["Use the lift","Use the stairs if safe","Stay at the desk","Close all exits"],"correct":1,"explanation":"Correct answer: Use the stairs if safe."},{"id":"Q15","level":3,"topic":"Main idea","question":"Read: Free computer lessons are available at the library every Wednesday. What is this notice about?","options":["A library closure","Computer lessons","Parking fines","Book returns"],"correct":1,"explanation":"Correct answer: Computer lessons."},{"id":"Q16","level":3,"topic":"Polite emails","question":"Which is an appropriate request to a colleague?","options":["Send it now!","Could you please send the report?","You never help.","Hurry up!"],"correct":1,"explanation":"Correct answer: Could you please send the report?."},{"id":"Q17","level":3,"topic":"Conditional sentences","question":"Complete: If it snows tomorrow, we ___ indoors.","options":["stayed","stays","will stay","staying"],"correct":2,"explanation":"Correct answer: will stay."},{"id":"Q18","level":3,"topic":"Present perfect","question":"Choose a correct sentence about a situation continuing now.","options":["I have lived here since May.","I has lived here.","I living here.","I live here since May."],"correct":0,"explanation":"Correct answer: I have lived here since May.."},{"id":"Q19","level":3,"topic":"Complaints","question":"A customer says their order arrived late and broken. What are the two complaints?","options":["Price and colour","Delay and damage","Size and address","Noise and heat"],"correct":1,"explanation":"Correct answer: Delay and damage."},{"id":"Q20","level":3,"topic":"Procedures","question":"Instructions say: Check your name, sign the form, then submit it. What comes second?","options":["Submit it","Pay a fee","Sign the form","Close the office"],"correct":2,"explanation":"Correct answer: Sign the form."},{"id":"Q21","level":3,"topic":"Job adverts","question":"The advert says: 'Weekend work essential, experience desirable.' What is required?","options":["Experience","Weekend availability","A degree","A car"],"correct":1,"explanation":"Correct answer: Weekend availability."},{"id":"Q22","level":3,"topic":"Timetable changes","question":"A session was brought forward from Friday to Wednesday. When is it now?","options":["Monday","Wednesday","Friday","Sunday"],"correct":1,"explanation":"Correct answer: Wednesday."},{"id":"Q23","level":3,"topic":"Comparing information","question":"Evening classes have more applicants, but morning classes have more free spaces. Which has more applicants?","options":["Morning","Evening","Both equal","Neither"],"correct":1,"explanation":"Correct answer: Evening."},{"id":"Q24","level":3,"topic":"Contrast","question":"Which sentence uses 'although' correctly?","options":["Although it rained, we went out.","Although it rained because.","We although went out rain.","Although because we went."],"correct":0,"explanation":"Correct answer: Although it rained, we went out.."},{"id":"Q25","level":4,"topic":"Evidence","question":"A survey of 200 residents found 70% wanted longer opening hours. What evidence supports the proposal?","options":["The survey result","The office colour","The chairperson's name","The date alone"],"correct":0,"explanation":"Correct answer: The survey result."},{"id":"Q26","level":4,"topic":"Formal writing","question":"Choose a suitable closing for a formal letter to a named person.","options":["See ya","Yours sincerely","Cheers mate","Bye for now"],"correct":1,"explanation":"Correct answer: Yours sincerely."},{"id":"Q27","level":4,"topic":"Inference","question":"A shop has its shutters down and a sign says 'Open at 10'. At 9:30, what is likely?","options":["It is not yet open","It never opens","It opens at 9","It has moved"],"correct":0,"explanation":"Correct answer: It is not yet open."},{"id":"Q28","level":4,"topic":"Sampling","question":"A claim about an entire city uses responses from five volunteers. What is the main concern?","options":["Very small sample","The survey has questions","Volunteers can speak","The city has streets"],"correct":0,"explanation":"Correct answer: Very small sample."},{"id":"Q29","level":4,"topic":"Concession","question":"Complete: '___ the journey was long, we arrived on time.'","options":["Despite","Although","Because of","During"],"correct":1,"explanation":"Correct answer: Although."},{"id":"Q30","level":4,"topic":"Summarising","question":"A notice says street parking is suspended Tuesday from 8 am to 6 pm. Which summary is best?","options":["No parking on Tuesday during those hours","No parking forever","Parking is free Tuesday","Parking ends Monday"],"correct":0,"explanation":"Correct answer: No parking on Tuesday during those hours."},{"id":"Q31","level":4,"topic":"Complaint letters","question":"Which sentence is a clear request for a remedy?","options":["I am furious.","This is awful.","Please replace the damaged item.","No one cares."],"correct":2,"explanation":"Correct answer: Please replace the damaged item.."},{"id":"Q32","level":4,"topic":"Data","question":"Attendance dropped from 75 to 60. What was the change?","options":["Rise of 15","Fall of 15","Fall of 25","No change"],"correct":1,"explanation":"Correct answer: Fall of 15."},{"id":"Q33","level":4,"topic":"Relative clauses","question":"Choose the correct word: 'The course, ___ starts Monday, is full.'","options":["who","which","where","whose"],"correct":1,"explanation":"Correct answer: which."},{"id":"Q34","level":4,"topic":"Conditions","question":"Entry requires passing an assessment. What must applicants do?","options":["Buy books","Pass the assessment","Attend a party","Bring a guest"],"correct":1,"explanation":"Correct answer: Pass the assessment."},{"id":"Q35","level":4,"topic":"Fact or opinion","question":"Which statement can be independently checked?","options":["The course is excellent.","The course has eight lessons.","The course is dull.","The tutor is the best."],"correct":1,"explanation":"Correct answer: The course has eight lessons.."},{"id":"Q36","level":4,"topic":"Assumptions","question":"A proposal claims Sunday opening will increase visitors. What does it assume?","options":["Some people would visit on Sundays","Nobody visits at weekends","All visitors are staff","Sunday is already the busiest day"],"correct":0,"explanation":"Correct answer: Some people would visit on Sundays."},{"id":"Q37","level":5,"topic":"Balanced arguments","question":"Online-only services may lower costs but exclude people without internet. What is the trade-off?","options":["Savings versus access","Design versus colour","Size versus speed","Noise versus safety"],"correct":0,"explanation":"Correct answer: Savings versus access."},{"id":"Q38","level":5,"topic":"Evidence and opinion","question":"Read: 'The waiting list has 300 people, so the service is poorly managed.' Which claim needs more evidence?","options":["There is a waiting list","300 people","The service is poorly managed","People"],"correct":2,"explanation":"Correct answer: The service is poorly managed."},{"id":"Q39","level":5,"topic":"Bias","question":"A retailer surveys only members of its rewards scheme. What could be missing?","options":["Views of non-members","All customer responses","The shop address","The date"],"correct":0,"explanation":"Correct answer: Views of non-members."},{"id":"Q40","level":5,"topic":"Recommendations","question":"A report finds long morning queues and recommends two more staff members. What is proposed?","options":["Two more morning staff","Shorter opening hours","Fewer appointments","New furniture"],"correct":0,"explanation":"Correct answer: Two more morning staff."},{"id":"Q41","level":5,"topic":"Uncertainty","question":"Which statement is appropriately cautious?","options":["The plan will certainly succeed.","The plan may help, but results are uncertain.","There is no risk.","Failure is impossible."],"correct":1,"explanation":"Correct answer: The plan may help, but results are uncertain.."},{"id":"Q42","level":5,"topic":"Exceptions","question":"Requests after the deadline are rejected unless an extension was agreed beforehand. Which late request may be accepted?","options":["One with a prior agreed extension","Any late request","Any unsigned request","None"],"correct":0,"explanation":"Correct answer: One with a prior agreed extension."},{"id":"Q43","level":5,"topic":"Percentage changes","question":"Group A rises from 20 to 30; Group B from 100 to 110. Which percentage increase is greater?","options":["Group B","Both equal","Group A","Neither"],"correct":2,"explanation":"Correct answer: Group A."},{"id":"Q44","level":5,"topic":"Ambiguity","question":"Read: 'Maria told Sara that she was late.' What is unclear?","options":["Who 'she' means","Whether Maria spoke","That time exists","Whether Sara is a name"],"correct":0,"explanation":"Correct answer: Who 'she' means."},{"id":"Q45","level":5,"topic":"Synthesising reports","question":"One report finds faster journeys; another finds higher fares. Which summary is accurate?","options":["Travel is quicker but costs may be higher","Both reports show falling costs","Both report slower journeys","Neither has findings"],"correct":0,"explanation":"Correct answer: Travel is quicker but costs may be higher."},{"id":"Q46","level":5,"topic":"Persuasive requests","question":"Which sentence gives a request with supporting evidence?","options":["Please review the fee because the receipt shows payment.","This is terrible.","Fix it!","I disagree."],"correct":0,"explanation":"Correct answer: Please review the fee because the receipt shows payment.."},{"id":"Q47","level":5,"topic":"Causation","question":"A new bus route began and attendance rose. What can we infer from this alone?","options":["The bus caused the rise","The events coincided; causation is unproven","No other factors matter","The bus had no possible effect"],"correct":1,"explanation":"Correct answer: The events coincided; causation is unproven."},{"id":"Q48","level":5,"topic":"Qualified conclusions","question":"A survey of 40 volunteers favoured a change. Which conclusion is justified?","options":["Everyone favours the change","The surveyed volunteers tended to favour it","All residents were surveyed","It proves universal support"],"correct":1,"explanation":"Correct answer: The surveyed volunteers tended to favour it."}];

const STORAGE='be-esol-final-test-web-v2';
const screen=document.getElementById('screen');
const BANK_BY_ID=Object.fromEntries(BANK.map(q=>[q.id,q]));
let active=[],pos=0,selected=[],attempts=[];
try{const saved=JSON.parse(localStorage.getItem(STORAGE)||'[]');if(Array.isArray(saved))attempts=saved.filter(x=>Number.isInteger(x.score)&&Array.isArray(x.ids)&&Array.isArray(x.answers))}catch(e){}
function n(tag,value,cls){const e=document.createElement(tag);if(value!==undefined)e.textContent=value;if(cls)e.className=cls;return e}
function add(el,...children){el.append(...children);return el}
function button(title,fn,cls=''){const b=n('button',title,cls);b.type='button';b.addEventListener('click',fn);return b}
function show(parts){screen.replaceChildren(...parts)}
function paragraph(t,cls){return n('p',t,cls)}
function shuffle(items){let a=[...items];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));let temp=a[i];a[i]=a[j];a[j]=temp}return a}
async function progressState(){const user=await getEsolUser();if(!user)return {user:null,counts:[]};const sets=await Promise.all([1,2,3,4,5].map(getEsolProgress));return {user,counts:sets.map(x=>new Set(x.map(r=>r.lesson_id)).size)}}
async function readinessGate(){const state=await progressState();if(!state.user){show([n('h1','Sign in to continue'),n('div','The practice questionnaire is linked to your learner account so your course progress can be checked.','note warning'),(()=>{const a=n('a','Open learner account');a.href='/esol/account/';return a})()]);return false}const complete=state.counts.filter(x=>x>=210).length;if(complete===5)return true;const parts=[n('h1','Course progress'),n('div','You have fully completed '+complete+' of 5 course levels. The questionnaire is available during private testing, but your master-course completion is shown below.','note warning')];state.counts.forEach((count,i)=>parts.push(paragraph(['Entry Level 1','Entry Level 2','Entry Level 3','Level 1','Level 2'][i]+': '+count+' / 210 lessons')));parts.push(button('Open practice questionnaire anyway',()=>startTest(true)),(()=>{const a=n('a','Return to ESOL courses');a.href='/esol/';a.style.marginLeft='15px';return a})());show(parts);return false}
async function startTest(skipGate=false){if(!skipGate && !(await readinessGate()))return;active=shuffle([2,3,4,5].flatMap(l=>shuffle(BANK.filter(q=>q.level===l)).slice(0,10)));pos=0;selected=[];question()}
async function intro(){if(!(await readinessGate()))return;let parts=[n('h1','ESOL Final Practice Test — V2'),paragraph('40 questions chosen from a separate bank of 48. Every attempt selects 10 per level for ESOL 2–5.'),paragraph('Repeat attempts are welcome. Results are saved on this device only.','muted'),n('div','Practice target: at least 80% overall and 70% at every level. This is not an official pass standard. No certificate is issued. Writing, speaking and listening are not assessed.','note warning')];let count=attempts.length;parts.push(paragraph(count?'Attempts: '+count+' · Best score: '+Math.max(...attempts.map(a=>a.score))+' / 40':'No previous attempts in this browser.'));let controls=n('div',undefined,'row');controls.append(button('Begin 40-question practice test',startTest));if(count)controls.append(button('View last results',()=>results(attempts[count-1]),'secondary'));parts.push(controls);show(parts)}
function question(){const q=active[pos];const parts=[n('div','Question '+(pos+1)+' of 40 · ESOL '+q.level,'tag')],bar=n('div',undefined,'progress'),fill=n('span');fill.style.width=(100*pos/40)+'%';bar.append(fill);parts.push(bar,n('h1',q.question),paragraph('Subject: '+q.topic,'muted'));const field=n('fieldset',undefined,'choices');field.append(n('legend','Choose one answer'));const next=button(pos===39?'Finish and view results':'Next question',()=>{if(!Number.isInteger(selected[pos]))return;if(pos===39)finish();else{pos++;question()}});next.disabled=!Number.isInteger(selected[pos]);q.options.forEach((option,i)=>{const label=n('label',undefined,'choice'),input=document.createElement('input');input.type='radio';input.name='answer';input.value=String(i);input.checked=selected[pos]===i;input.addEventListener('change',()=>{selected[pos]=i;next.disabled=false});label.append(input,document.createTextNode(option));field.append(label)});parts.push(field,next);show(parts)}
function finish(){let score=active.reduce((sum,q,i)=>sum+(selected[i]===q.correct?1:0),0);let record={date:new Date().toISOString(),score,total:40,ids:active.map(q=>q.id),answers:[...selected]};attempts.push(record);try{localStorage.setItem(STORAGE,JSON.stringify(attempts))}catch(e){}results(record)}
function results(a){const qs=a.ids.map(id=>BANK_BY_ID[id]);if(qs.some(q=>!q)){intro();return}let levels={};for(const l of [2,3,4,5]){let subset=qs.map((q,i)=>({q,i})).filter(x=>x.q.level===l),good=subset.filter(x=>a.answers[x.i]===x.q.correct).length;levels[l]={good,total:subset.length,percent:Math.round(100*good/subset.length)}}const percent=Math.round(100*a.score/a.total),met=percent>=80&&Object.values(levels).every(x=>x.percent>=70),items=[n('h1','Your practice results'),n('h2',a.score+' / '+a.total+' — '+percent+'%'),n('div',met?'Practice benchmark met. This is not a qualification or certificate.':'Practice benchmark not yet met. Review the topics below and try again.','note'),paragraph('These results cover multiple-choice reading and language use only.','muted')];const table=n('table'),head=n('tr');for(const h of ['Level','Correct','Percent','Practice target'])head.append(n('th',h));table.append(head);for(const l of [2,3,4,5]){const x=levels[l],tr=n('tr');for(const v of ['ESOL '+l,x.good+' / '+x.total,x.percent+'%',x.percent>=70?'Met':'Review'])tr.append(n('td',v));table.append(tr)}items.push(table);const controls=n('div',undefined,'row');controls.append(button('Try another question set',startTest),button('Back to overview',intro,'secondary'));items.push(controls,n('h2','Review your answers'));qs.forEach((q,i)=>{const good=a.answers[i]===q.correct,box=n('section',undefined,'review');box.append(n('div','ESOL '+q.level+' · '+q.topic,'tag'),n('h3',(i+1)+'. '+q.question),paragraph('Your answer: '+(q.options[a.answers[i]]||'Not answered'),good?'good':'bad'));if(!good)box.append(paragraph('Correct answer: '+q.options[q.correct],'good'));box.append(paragraph('Explanation: '+q.explanation));items.push(box)});show(items);window.scrollTo(0,0)}
intro().catch(e=>show([n('h1','Questionnaire unavailable'),paragraph(e.message,'bad')]));
</script></body></html>
