<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brainy Elephant | ESOL Final Practice Test</title>
<style>
:root{color-scheme:light;font:16px/1.55 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#f3f6fa;color:#1b2d42}*{box-sizing:border-box}body{margin:0}header{background:#102e50;color:#fff;border-bottom:5px solid #be344a}header .wrap{max-width:1000px;margin:auto;padding:22px 20px}header b{font-size:1.18rem;letter-spacing:.01em}header small{display:block;color:#dbe6f2}main{max-width:1000px;margin:25px auto;padding:0 18px 48px}.card{background:white;border:1px solid #dbe4ed;border-radius:13px;padding:25px;box-shadow:0 4px 14px #16325210}.muted{color:#546a7e}.note{background:#eef4fa;border-left:4px solid #2d5e91;padding:12px 15px;border-radius:4px;margin:15px 0}.warning{background:#fff8e9;border-left-color:#996b21}button{cursor:pointer;font:inherit;border:1px solid #164b80;border-radius:9px;padding:11px 17px;background:#164b80;color:white;font-weight:650}button:hover{filter:brightness(.93)}button:focus-visible,input:focus-visible{outline:3px solid #d03b52;outline-offset:3px}button.secondary{background:#fff;color:#164b80}button:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}.choices{border:0;padding:0;margin:18px 0}.choices legend{font-weight:700;margin-bottom:12px}.choice{display:block;border:1px solid #c9d7e4;border-radius:9px;padding:12px 13px;margin-bottom:9px;cursor:pointer}.choice:has(input:checked){background:#eaf2fc;border-color:#2461a4}.choice input{margin-right:10px}.progress{height:10px;background:#e1e9f1;border-radius:6px;overflow:hidden;margin:18px 0}.progress span{height:100%;background:#215d99;display:block}table{border-collapse:collapse;width:100%;margin:15px 0}th,td{text-align:left;border-bottom:1px solid #dce5ee;padding:10px}th{background:#f1f5f9}.good{color:#176546;font-weight:700}.bad{color:#a02b39;font-weight:700}.review{border:1px solid #d8e2ea;border-radius:9px;padding:15px;margin:11px 0}.review h3{margin:0 0 8px;font-size:1.02rem}.review p{margin:5px 0}.tag{font-size:.85rem;font-weight:700;color:#516c88}h1{line-height:1.25;font-size:1.7rem}h2{line-height:1.3}#status{min-height:1.5em}footer{padding:0 20px 25px;text-align:center;color:#64758a;font-size:.82rem}@media(max-width:520px){.card{padding:17px}h1{font-size:1.38rem}}
</style></head><body>
<header><div class="wrap"><b>Brainy Elephant</b><small>ESOL Learning • Final Practice Test</small></div></header>
<main><section class="card" id="screen" aria-live="polite"></section></main>
<footer>Brainy Elephant educational practice • Not an Ofqual-regulated qualification</footer>
<script>
'use strict';
const QUESTIONS=[{"level":2,"topic":"Making appointments","question":"A receptionist asks if Thursday at 10 am is suitable. What confirms the appointment?","options":["No appointments exist.","Yes, Thursday at ten is fine.","I went yesterday.","The office is closed."],"correct":1,"explanation":"Confirm the day and time clearly."},{"level":2,"topic":"Talking about yesterday","question":"Choose the sentence about a completed action.","options":["I am visiting now.","I will visit tomorrow.","I visited yesterday.","I visit every week."],"correct":2,"explanation":"Visited is the past simple."},{"level":2,"topic":"Reading a timetable","question":"A train leaves at 08:45 and arrives at 09:20. When does it arrive?","options":["08:45","09:20","08:20","09:45"],"correct":1,"explanation":"The arrival time is 09:20."},{"level":2,"topic":"Asking for clarification","question":"You missed the instructions. What is the best response?","options":["Say nothing.","I understood everything.","Could you repeat that, please?","Stop talking."],"correct":2,"explanation":"A polite request for repetition helps you understand."},{"level":2,"topic":"At work","question":"A rota shows your shift starts at 09:00. What does that mean?","options":["You finish at nine.","You begin work at nine.","The shop closes at nine.","Your break starts at nine."],"correct":1,"explanation":"A starting time tells you when to begin work."},{"level":2,"topic":"Giving reasons","question":"Complete: I stayed at home ___ I was unwell.","options":["although","because","until","before"],"correct":1,"explanation":"Because explains why something happened."},{"level":2,"topic":"Finding a place","question":"The library is between the post office and the bank. Where is it?","options":["Inside the bank","Between two places","Behind every building","At the railway station"],"correct":1,"explanation":"Between identifies a position in the middle."},{"level":2,"topic":"Reading an email","question":"An email says “Reply by Friday”. When should you respond?","options":["After next month","Only on Sunday","By Friday","Whenever you want"],"correct":2,"explanation":"Reply no later than Friday."},{"level":2,"topic":"Describing plans","question":"Which sentence describes a future plan?","options":["I went yesterday.","I am going to apply tomorrow.","I applied last year.","I apply every day."],"correct":1,"explanation":"Going to plus verb expresses an intended action."},{"level":2,"topic":"Comparing choices","question":"A bus costs £2 and a taxi costs £12. Which is cheaper?","options":["The taxi","Both cost £12","The bus","Neither has a price"],"correct":2,"explanation":"The bus costs less money."},{"level":3,"topic":"Giving an opinion","question":"Which answer gives an opinion and a reason?","options":["The bus leaves at six.","I prefer trains because they are comfortable.","Platform five.","I have a ticket."],"correct":1,"explanation":"The sentence offers a preference and explains it."},{"level":3,"topic":"Reading workplace instructions","question":"A notice says “Report spills immediately”. What should you do?","options":["Ignore spills.","Wait until next week.","Inform the appropriate person promptly.","Close the workplace."],"correct":2,"explanation":"Immediately means without unnecessary delay."},{"level":3,"topic":"Understanding a paragraph","question":"What is the main idea of that sentence?","options":["The centre provides evening adult courses.","Computers are expensive.","The centre is closed.","All adults study English."],"correct":0,"explanation":"The sentence introduces the courses available."},{"level":3,"topic":"Making polite requests","question":"Choose the most appropriate polite workplace request.","options":["Give me that now.","You must send it.","Would you mind emailing the details?","Why are you slow?"],"correct":2,"explanation":"The wording is polite and clear."},{"level":3,"topic":"Conditional sentences","question":"Complete: If I finish early, I ___ you.","options":["called","will call","calling","calls"],"correct":1,"explanation":"Use will plus base verb for the possible result."},{"level":3,"topic":"Describing experience","question":"Which sentence correctly describes continuing experience?","options":["I have lived here for three years.","I living here for three years.","I live here since three years.","I has lived here."],"correct":0,"explanation":"Have lived correctly uses the present perfect."},{"level":3,"topic":"Understanding a complaint","question":"What is the issue in that sentence?","options":["The parcel arrived early.","The customer moved house.","The parcel was damaged.","The address changed."],"correct":2,"explanation":"The complaint concerns a damaged parcel."},{"level":3,"topic":"Explaining a process","question":"What should happen immediately after completing the form?","options":["Submit it with nothing attached.","Attach proof of address.","Start the form again.","Wait for a phone call."],"correct":1,"explanation":"Next introduces the second step."},{"level":3,"topic":"Reading an advert","question":"Which statement is supported by the advert?","options":["Computer skills are optional.","All applicants get the job.","Computer skills are required.","Applications are closed."],"correct":2,"explanation":"Must indicates a requirement."},{"level":3,"topic":"Responding to a change","question":"What happened to the meeting?","options":["It was cancelled permanently.","It was moved to a later date.","It started early.","It finished already."],"correct":1,"explanation":"Postponed means delayed."},{"level":4,"topic":"Identifying an argument","question":"What is the evidence mentioned in the example?","options":["The writer’s name","Shorter waiting times","The publication date","The service address"],"correct":1,"explanation":"The waiting-time information supports the claim."},{"level":4,"topic":"Formal and informal language","question":"Which opening best suits a formal application?","options":["Hey mate!","What’s up?","Dear Recruitment Team,","Oi, listen."],"correct":2,"explanation":"A professional salutation fits a formal application."},{"level":4,"topic":"Understanding inference","question":"What might reasonably be inferred?","options":["It may have been raining.","It was definitely snowing.","It was midnight.","Nobody went outside."],"correct":0,"explanation":"Wet pavements and umbrellas suggest rain, without proving it."},{"level":4,"topic":"Evaluating sources","question":"What information would help assess the survey?","options":["The font size","Number of respondents","The page colour","The author’s favourite food"],"correct":1,"explanation":"Sample size helps judge how informative a survey is."},{"level":4,"topic":"Using contrast","question":"Choose the sentence that shows contrast.","options":["We left because it rained.","Although it was difficult, she succeeded.","I ate lunch and dinner.","The shop opens at nine."],"correct":1,"explanation":"Although contrasts difficulty with success."},{"level":4,"topic":"Summarising information","question":"Which is the clearest summary?","options":["Residents should sort recycling and put bins out Wednesday.","Bins can be any colour.","The notice says nothing useful.","Recycling is always collected daily."],"correct":0,"explanation":"This retains both key instructions."},{"level":4,"topic":"Writing a formal complaint","question":"Which sentence states a specific remedy?","options":["I am unhappy.","This is terrible.","Please provide a revised delivery date.","You never help anyone."],"correct":2,"explanation":"It clearly requests a specific action."},{"level":4,"topic":"Analysing a chart","question":"What happened to attendance?","options":["It fell by 20.","It rose by 20.","It stayed the same.","It doubled."],"correct":1,"explanation":"Sixty minus forty is twenty."},{"level":4,"topic":"Using relative clauses","question":"Choose the correct relative word: The manager ___ interviewed me was helpful.","options":["which","where","who","when"],"correct":2,"explanation":"Who refers to a person."},{"level":4,"topic":"Understanding conditions","question":"What is required to enter the course?","options":["Pay for travel.","Complete the assessment.","Bring three guests.","Attend on Sundays."],"correct":1,"explanation":"Entry depends on completing the assessment."},{"level":5,"topic":"Evaluating a balanced argument","question":"Which concern balances the claimed savings?","options":["The document is long.","Reduced rural access","The title uses capital letters.","The proposal was written recently."],"correct":1,"explanation":"The drawback is reduced access for rural residents."},{"level":5,"topic":"Distinguishing fact from opinion","question":"Which part is an opinion?","options":["The library","6 pm","It closes too early","The closing time"],"correct":2,"explanation":"Too early is a judgement."},{"level":5,"topic":"Recognising bias","question":"What is the main concern?","options":["The sample may be unrepresentative.","All customers are satisfied.","There were no customers.","The writer used a full stop."],"correct":0,"explanation":"Selecting only satisfied responses may bias the results."},{"level":5,"topic":"Writing a concise executive summary","question":"Which is the central recommendation?","options":["Rewrite the title.","Add morning capacity.","Remove the findings.","Delay the report."],"correct":1,"explanation":"The proposed action is to increase morning capacity."},{"level":5,"topic":"Interpreting uncertainty","question":"What does likely mean here?","options":["Delays are impossible.","Delays are certain.","Delays are probable but not certain.","There have never been delays."],"correct":2,"explanation":"Likely is not the same as guaranteed."},{"level":5,"topic":"Understanding policy language","question":"Who may be excused from attendance?","options":["Anyone who is busy","Only people with an approved exemption","Every applicant","Nobody under any circumstances"],"correct":1,"explanation":"The policy explicitly allows an approved exemption."},{"level":5,"topic":"Comparing data carefully","question":"Which group had the larger percentage increase?","options":["Group A","Group B","Both were 10%","Neither increased"],"correct":0,"explanation":"Group A doubled (100%); Group B increased 10%."},{"level":5,"topic":"Editing ambiguous statements","question":"What is unclear in this sentence?","options":["The deadline","Who “he” refers to","That someone spoke","That there was a conversation"],"correct":1,"explanation":"He could mean Sam or Alex."},{"level":5,"topic":"Synthesising multiple sources","question":"Which summary is most accurate?","options":["Both reports agree on everything.","Neither report mentions a date.","The date agrees, but attendance estimates differ.","One report must be false."],"correct":2,"explanation":"The reports align on the date but not the attendance estimate."},{"level":5,"topic":"Structuring a persuasive letter","question":"Which sentence includes a request and supporting reason?","options":["I am angry.","Please review the decision because the recorded date is wrong.","The weather was bad.","I liked the old system."],"correct":1,"explanation":"It states the requested action and grounds for it."}];
const STORAGE='be-esol-final-test-web-v1';
const screen=document.getElementById('screen');
let pos=0, selected=[],attempts=[];
try{let saved=JSON.parse(localStorage.getItem(STORAGE)||'[]');if(Array.isArray(saved))attempts=saved.filter(x=>Number.isInteger(x.score)&&Array.isArray(x.answers));}catch(_){}
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function add(parent,...elements){parent.append(...elements);return parent}
function btn(text,action,cls=''){const b=node('button',text,cls);b.type='button';b.addEventListener('click',action);return b}
function show(content){screen.replaceChildren(...content)}
function para(t,cls){return node('p',t,cls)}
function intro(){let content=[node('h1','ESOL Final Practice Test'),para('Forty multiple-choice questions: ten each from ESOL 2, ESOL 3, ESOL 4 and ESOL 5.'),para('You may retake the assessment as often as you wish. Answers and explanations appear after you finish. Results are saved on this device only.','muted'),node('div','This test checks selected reading and language-use questions. It does not assess independent writing, speaking or listening and does not issue an official or Brainy Elephant certificate.','note warning')];
let count=attempts.length;content.push(para(count?`Previous attempts: ${count} · Best result: ${Math.max(...attempts.map(a=>a.score))} / ${QUESTIONS.length}`:'No previous attempts on this device.'));
let controls=node('div',undefined,'row');add(controls,btn('Begin 40-question test',()=>{pos=0;selected=[];question()}));if(count)add(controls,btn('View last results',()=>results(attempts[count-1]),'secondary'));content.push(controls);show(content)}
function question(){const q=QUESTIONS[pos];let parts=[node('div',`Question ${pos+1} of ${QUESTIONS.length} · ESOL ${q.level}`,'tag')];const bar=node('div',undefined,'progress');const fill=node('span');fill.style.width=`${100*pos/QUESTIONS.length}%`;add(bar,fill);parts.push(bar,node('h1',q.question),para('Subject: '+q.topic,'muted'));
const field=node('fieldset',undefined,'choices');add(field,node('legend','Choose one answer'));
q.options.forEach((opt,i)=>{const label=node('label',undefined,'choice');const input=document.createElement('input');input.type='radio';input.name='answer';input.value=String(i);input.checked=selected[pos]===i;input.addEventListener('change',()=>{selected[pos]=i;next.disabled=false});add(label,input,document.createTextNode(opt));field.append(label)});
const next=btn(pos===QUESTIONS.length-1?'Finish and view results':'Next question',()=>{if(!Number.isInteger(selected[pos]))return;if(pos===QUESTIONS.length-1){finish()}else{pos++;question()}});next.disabled=!Number.isInteger(selected[pos]);parts.push(field,next);show(parts)}
function finish(){const answers=QUESTIONS.map((q,i)=>selected[i]);const score=QUESTIONS.reduce((acc,q,i)=>acc+(answers[i]===q.correct?1:0),0);const record={date:new Date().toISOString(),score,total:QUESTIONS.length,answers};attempts.push(record);try{localStorage.setItem(STORAGE,JSON.stringify(attempts))}catch(_){}results(record)}
function results(a){const items=[node('h1','Your practice results'),node('h2',`${a.score} / ${a.total} — ${Math.round(100*a.score/a.total)}%`),para('Practice assessment only. No certificate has been issued.','muted')];
const tbl=node('table');const head=node('tr');add(head,node('th','Level'),node('th','Correct'),node('th','Percentage'));tbl.append(head);for(const level of [2,3,4,5]){let total=0,good=0;QUESTIONS.forEach((q,i)=>{if(q.level===level){total++;if(a.answers[i]===q.correct)good++}});const tr=node('tr');add(tr,node('td','ESOL '+level),node('td',`${good} / ${total}`),node('td',`${Math.round(100*good/total)}%`));tbl.append(tr)}items.push(tbl);
let controls=node('div',undefined,'row');add(controls,btn('Retake test',()=>{pos=0;selected=[];question()}),btn('Back to overview',intro,'secondary'));items.push(controls,node('h2','Review your answers'));
QUESTIONS.forEach((q,i)=>{const box=node('section',undefined,'review');add(box,node('div',`ESOL ${q.level} · ${q.topic}`,'tag'),node('h3',`${i+1}. ${q.question}`));const good=a.answers[i]===q.correct;add(box,para('Your answer: '+(q.options[a.answers[i]]??'No answer'),good?'good':'bad'));if(!good)add(box,para('Correct answer: '+q.options[q.correct],'good'));add(box,para('Explanation: '+q.explanation));items.push(box)});show(items);window.scrollTo(0,0)}
intro();
</script></body></html>
